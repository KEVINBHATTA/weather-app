<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
<link rel="stylesheet" href="style.css" >
</head>
<body>
<div class= "box">
<div class= "container">

<label id="text">Check the Weather of Nepal</label><br><br>
<Input type="text" id="getCity" placeholder="Enter Your City">
<br><br>
<button onclick="getWeather()">CHECK NOW</button>
<br>
<div class= "display">

<!-- section 1 -->
<div class="result">
<label class="txt">City</label>
<hr>
<p id="city"><p>
</div> 

<!-- section 2 -->
<div class="result">
<label class="txt">TEMPERTURE</label>
<hr>
<p id="tempr"><p>
</div>

<!-- section 3 -->
<div class="result">
<label class="txt">HUMIDITY</label>
<hr>
<p id="humidityy"><p>
</div> 

<!-- section 4 -->
<div class="result">
<label class="txt">FEELS LIKE</label>
<hr>
<p id="feels_like"><p>
</div> 


</div>
</div>
</div>



<script src="app.js"></script>
</body>
</html>
