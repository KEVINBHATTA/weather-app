<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="box">
    <div class="container">

      <label id="text">Check the Weather of Nepal</label>

      <input type="text" id="getCity" placeholder="Enter Your City">
      <button onclick="getWeather()">CHECK NOW</button>

      <div class="display">
        <div class="result">
          <label class="txt">City</label>
          <hr>
          <p id="city"></p>
        </div>
        <div class="result">
          <label class="txt">Temperature</label>
          <hr>
          <p id="tempr"></p>
        </div>
        <div class="result">
          <label class="txt">Humidity</label>
          <hr>
          <p id="humidityy"></p>
        </div>
        <div class="result">
          <label class="txt">Feels Like</label>
          <hr>
          <p id="feels_like"></p>
        </div>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
